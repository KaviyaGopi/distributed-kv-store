services:
  kafka:
    image: apache/kafka:latest
    container_name: kv-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  node1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: kv-node1
    command:
      - -node-id=node1
      - -data-dir=/data
      - -http-addr=0.0.0.0:8080
      - -http-advertise-addr=node1:8080
      - -raft-bind-base=0.0.0.0:9001
      - -raft-advertise-base=node1:9001
      - -bootstrap
      - -kafka-brokers=kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      - kafka

  node2:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: kv-node2
    command:
      - -node-id=node2
      - -data-dir=/data
      - -http-addr=0.0.0.0:8080
      - -http-advertise-addr=node2:8080
      - -raft-bind-base=0.0.0.0:9001
      - -raft-advertise-base=node2:9001
      - -join=http://node1:8080
      - -kafka-brokers=kafka:9092
    ports:
      - "8082:8080"
    depends_on:
      - node1

  node3:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: kv-node3
    command:
      - -node-id=node3
      - -data-dir=/data
      - -http-addr=0.0.0.0:8080
      - -http-advertise-addr=node3:8080
      - -raft-bind-base=0.0.0.0:9001
      - -raft-advertise-base=node3:9001
      - -join=http://node1:8080
      - -kafka-brokers=kafka:9092
    ports:
      - "8083:8080"
    depends_on:
      - node1

  events-consumer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: kv-events-consumer
    entrypoint: ["/usr/local/bin/kv-events-consumer"]
    command:
      - -brokers=kafka:9092
      - -topic=kv-events
    depends_on:
      - kafka

  prometheus:
    image: prom/prometheus:latest
    container_name: kv-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - node1
      - node2
      - node3

  grafana:
    image: grafana/grafana:latest
    container_name: kv-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
